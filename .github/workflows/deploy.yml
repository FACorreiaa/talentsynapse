name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  GO_VERSION: '1.23'
  BINARY_NAME: server

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Generate Templ templates
        run: templ generate

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for git describe

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Install Tailwind CSS
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Generate Templ templates
        run: templ generate

      - name: Build CSS
        run: tailwindcss -i ./assets/css/input.css -o ./assets/css/output.css --minify

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo ${{ github.sha }})" \
            -o ./bin/${{ env.BINARY_NAME }} \
            ./cmd/server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: bin/${{ env.BINARY_NAME }}
          retention-days: 7

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: server-binary
          path: bin/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          # Upload new binary with temporary name
          scp -o StrictHostKeyChecking=no \
            bin/${{ env.BINARY_NAME }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/myapp/server.new

          # Run deployment script on VPS
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'bash /var/www/myapp/deploy.sh'

      - name: Health check
        run: |
          sleep 5
          curl -sf https://${{ secrets.VPS_DOMAIN }}/health || exit 1
          echo "✅ Deployment successful!"
