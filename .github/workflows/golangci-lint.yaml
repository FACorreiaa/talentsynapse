name: golangci-lint
on:
    push:
        branches:
            - main
            - master
    pull_request:

permissions:
    contents: read

jobs:
    golangci:
        name: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version: stable
            - name: Install templ
              run: go install github.com/a-h/templ/cmd/templ@latest
            - name: Generate templ files
              run: templ generate
            - name: golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.6
