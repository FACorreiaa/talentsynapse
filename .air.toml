# Air configuration for live reload
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  # 1. Generate Templ files
  # 2. Build Tailwind CSS (scans generated templates for classes)
  # 3. Build the Go binary
  cmd = "templ generate && tailwindcss -i ./assets/css/input.css -o ./assets/css/output.css --minify && go build -o ./tmp/main ./cmd/server"

  # Binary to run after build
  bin = "./tmp/main"§

  # Arguments to pass to the binary
  args_bin = []

  # Environment variables for the running binary
  envs = ["GO_ENV=development", "PORT=8080"]

  # Delay before rebuilding (ms) - prevents rapid rebuilds
  delay = 1000

  # Directories to exclude from watching
  exclude_dir = ["tmp", "vendor", "bin", "node_modules", ".git"]

  # Include directories to watch
  include_dir = []

  # File extensions to watch
  include_ext = ["go", "tpl", "tmpl", "templ", "html", "css"]

  # Files to exclude
  exclude_file = []

  # Regex patterns to exclude
  exclude_regex = ["_test.go", ".*_templ.go"]
  
  # Exclude unchanged files
  exclude_unchanged = false
  
  # Follow symlinks
  follow_symlink = false
  
  # Working directory
  full_bin = ""
  
  # Log build output
  log = "build-errors.log"
  
  # Polling mode (for some filesystems)
  poll = false
  poll_interval = 0
  
  # Rerun on file change
  rerun = false
  rerun_delay = 500
  
  # Send interrupt before kill
  send_interrupt = false
  
  # Stop on error
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  # Show full log time
  time = true
  
  # Only show main output
  main_only = false

[misc]
  # Delete tmp dir on exit
  clean_on_exit = true

[screen]
  # Clear screen on rebuild
  clear_on_rebuild = true
  # Keep scroll position
  keep_scroll = true
