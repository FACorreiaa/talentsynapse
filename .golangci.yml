# golangci-lint configuration v2
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

issues:
  # Maximum count of issues with the same text.
  # Set to 0 to disable.
  # Default: 3
  max-same-issues: 50

formatters:
  settings:
    gofumpt:
      extra-rules: true

linters:
  default: standard
  enable:
    - gosec
    - govet
    - revive

  settings:
    funlen:
      lines: 100
      statements: 50

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    goconst:
      min-len: 3
      min-occurrences: 3

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style

    misspell:
      locale: US

    nestif:
      min-complexity: 4

    revive:
      rules:
        - name: unexported-return
          disabled: true

  exclusions:
    generated: lax
    paths:
      - vendor
      - tmp
      - bin
    rules:
      # Exclude some linters from running on tests
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gocognit
          - gosec

      # Exclude generated templ files
      - path: _templ\.go
        linters:
          - all
